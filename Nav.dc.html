<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/organic-f203ec68-e461-4e72-a388-64270db32e26/styles.css">
  <script src="_ds/organic-f203ec68-e461-4e72-a388-64270db32e26/_ds_bundle.js"></script>
  <style>
    :root{
      --color-accent:#2f5c8a; --color-accent-100:#e9eef5; --color-accent-200:#c9d7e8;
      --color-accent-300:#a0bad7; --color-accent-400:#6f95c0; --color-accent-500:#3f6da3;
      --color-accent-600:#2f5c8a; --color-accent-700:#234069; --color-accent-800:#182c4a; --color-accent-900:#0e1a2d;
      --color-accent-2:#b98f47; --color-accent-2-100:#faf3e6; --color-accent-2-200:#f0e0bf;
      --color-accent-2-300:#e2c896; --color-accent-2-400:#d1ac6c; --color-accent-2-500:#b98f47;
      --color-accent-2-600:#96712f; --color-accent-2-700:#745523; --color-accent-2-800:#523c19; --color-accent-2-900:#31240f;
    }
  </style>
</helmet>
<nav class="nav" style="display:flex;align-items:center;gap:clamp(12px,3vw,32px);flex-wrap:wrap;padding:12px clamp(16px,5vw,64px);background:#fff;border-bottom:2px solid var(--color-accent-700)">
  <a href="index.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--color-text);margin-right:auto;min-width:0">
    <img src="assets/insignia-azul.png" alt="Escudo del colegio" style="width:46px;height:auto;object-fit:contain;flex-shrink:0">
    <span style="line-height:1.15;min-width:0">
      <span style="display:block;font-family:var(--font-body);font-weight:700;font-size:16px;letter-spacing:-0.01em;color:var(--color-accent-800);white-space:nowrap">Colegio San Agustín</span>
      <span style="display:block;font-family:var(--font-body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6">Villa Alemana</span>
    </span>
  </a>
  <a href="index.dc.html" style="{{ inicioStyle }}">Inicio</a>
  <a href="nosotros.dc.html" style="{{ nosotrosStyle }}">Nosotros</a>
  <a href="galeria.dc.html" style="{{ galeriaStyle }}">Galería</a>
  <a href="contacto.dc.html" style="{{ contactoStyle }}">Contacto</a>
  <a href="betel.dc.html" class="btn btn-secondary" style="font-size:14px">Betel</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || '';
    const base = { textDecoration: 'none', color: 'var(--color-text)', fontFamily: 'var(--font-body)', fontSize: '15px', paddingBottom: '3px', borderBottom: '2px solid transparent' };
    const on = { ...base, color: 'var(--color-accent-700)', fontWeight: 600, borderBottom: '2px solid var(--color-accent-500)' };
    return {
      inicioStyle: active === 'inicio' ? on : base,
      nosotrosStyle: active === 'nosotros' ? on : base,
      galeriaStyle: active === 'galeria' ? on : base,
      contactoStyle: active === 'contacto' ? on : base,
    };
  }
}
</script>
</body>
</html>
