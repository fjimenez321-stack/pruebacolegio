<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voz Estudiantil — Visor digital</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --blanco:#ffffff;
  --azul:#2f5f8f; --azul-800:#1c3a58; --azul-200:#dde9f6;
  --beige:#b99a63; --beige-200:#f2e9d8; --beige-800:#5f4c2d;
  --gris-100:#f7f5f0; --gris-300:#c3bcac; --gris-700:#6b6558; --gris-900:#211e18;
  --sombra:0 18px 40px rgba(20,42,64,.20);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Source Sans 3',Arial,sans-serif;
  background:var(--blanco); color:var(--gris-900);
  min-height:100vh; display:flex; flex-direction:column;
}

/* ---------- Encabezado ---------- */
.visor-head{
  padding:18px 24px 12px; border-bottom:4px solid var(--azul);
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap; flex:none;
  background:linear-gradient(180deg, var(--azul-200) 0%, var(--blanco) 100%);
}
.visor-head-left{ display:flex; align-items:center; gap:14px; }
.visor-escudo{ width:46px; height:auto; flex:none; }
.visor-title{
  font-family:'Playfair Display',Georgia,serif; font-weight:900;
  letter-spacing:.05em; font-size:clamp(21px,4vw,32px);
  margin:0; line-height:1;
}
.visor-sub{
  margin:4px 0 0; font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--gris-700); font-weight:700;
}
.visor-head-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.visor-edicion{
  padding:6px 15px; border:1px solid var(--azul); border-radius:999px;
  font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--azul-800); font-weight:700; white-space:nowrap;
}
.btn-inicio{
  display:inline-flex; align-items:center; gap:7px;
  padding:8px 16px 8px 12px; border-radius:999px; border:1px solid var(--azul);
  background:var(--azul); color:#fff; text-decoration:none;
  font-size:12.5px; font-weight:700; letter-spacing:.03em;
  transition:background .18s ease, box-shadow .18s ease, transform .18s ease;
}
.btn-inicio svg{ width:14px; height:14px; flex:none; }
.btn-inicio:hover{ background:var(--azul-800); border-color:var(--azul-800); box-shadow:0 6px 14px rgba(28,58,88,.24); transform:translateY(-1px); }

/* ---------- Escenario ---------- */
.escenario{
  flex:1 1 auto; min-height:0; position:relative; overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 0%, var(--azul-200) 0%, rgba(221,233,246,0) 62%),
    var(--gris-100);
  display:flex; align-items:center; justify-content:center; padding:24px 16px;
}
.libro{
  position:relative; display:flex; gap:0;
  perspective:2400px; transform-origin:center center;
}
.hoja{
  position:relative; background:var(--blanco);
  box-shadow:var(--sombra); overflow:hidden; flex:none;
}
.hoja img{display:block; width:100%; height:100%; object-fit:contain; background:var(--blanco)}
.hoja--vacia{background:var(--gris-100); box-shadow:none}

/* Hoja que gira */
.leaf{
  position:absolute; top:0; z-index:30;
  transform-style:preserve-3d; transition:transform .62s cubic-bezier(.5,.02,.35,1);
  pointer-events:none;
}
.leaf .cara{
  position:absolute; inset:0; backface-visibility:hidden;
  background:var(--blanco); box-shadow:var(--sombra); overflow:hidden;
}
.leaf .cara img{display:block;width:100%;height:100%;object-fit:contain}
.leaf .cara--tras{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){ .leaf{transition-duration:.01ms} }

/* ---------- Estado ---------- */
.estado{
  position:absolute; inset:0; z-index:50; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px; text-align:center;
  background:var(--gris-100); padding:28px;
}
.estado[hidden]{display:none}
.spinner{
  width:36px;height:36px;border-radius:50%;
  border:3px solid var(--azul-200); border-top-color:var(--azul);
  animation:girar .9s linear infinite;
}
@keyframes girar{to{transform:rotate(360deg)}}
.estado p{margin:0;font-size:14px;color:var(--gris-700);max-width:440px;line-height:1.55}
.estado strong{display:block;color:var(--azul-800);font-size:15.5px;margin-bottom:6px}
.estado code{background:var(--azul-200);padding:1px 6px;border-radius:4px;font-size:12.5px}

/* ---------- Controles ---------- */
.controles{
  flex:none; border-top:1px solid var(--gris-300); background:var(--blanco);
  padding:12px 20px; display:flex; align-items:center; justify-content:center;
  gap:9px; flex-wrap:wrap;
  box-shadow:0 -8px 18px rgba(28,58,88,.05);
}
.btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:9px 16px; border-radius:999px; border:1px solid var(--gris-300);
  background:var(--blanco); color:var(--azul-800);
  font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer;
  transition:background .18s ease,border-color .18s ease,color .18s ease;
  text-decoration:none;
}
.btn:hover:not(:disabled){background:var(--azul-200);border-color:var(--azul)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn-primario{background:var(--azul);border-color:var(--azul);color:#fff}
.btn-primario:hover:not(:disabled){background:var(--azul-800);border-color:var(--azul-800);color:#fff}
.btn-beige{background:var(--beige-200);border-color:var(--beige);color:var(--beige-800)}
.btn-beige:hover:not(:disabled){background:var(--beige);color:#fff}
.indicador{
  min-width:104px; text-align:center; font-size:13px; font-weight:700;
  color:var(--gris-700); letter-spacing:.04em;
}
.sep{width:1px;height:24px;background:var(--gris-300);margin:0 3px}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
input[type=file]{display:none}

@media (max-width:640px){
  .escenario{padding:12px 8px}
  .controles{padding:10px 12px;gap:6px}
  .btn{padding:8px 12px;font-size:12.5px}
  .sep{display:none}
  .indicador{order:-1;width:100%;font-size:12px}
}
</style>
</head>
<body>

<header class="visor-head">
  <div class="visor-head-left">
    <img src="assets/escudo.png" alt="Escudo Colegio San Agustín" class="visor-escudo">
    <div>
      <h1 class="visor-title">Voz Estudiantil</h1>
      <p class="visor-sub">Colegio San Agustín de Villa Alemana</p>
    </div>
  </div>
  <div class="visor-head-right">
    <a class="btn-inicio" href="https://www.sanagustinvillaalemana.cl/" aria-label="Volver al sitio del Colegio San Agustín de Villa Alemana">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 11.5L12 4l9 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5.5 10v9a1 1 0 0 0 1 1H9.5a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Inicio</span>
    </a>
    <span class="visor-edicion">Edición · Agosto 2026</span>
  </div>
</header>

<div class="escenario" id="escenario">
  <div class="libro" id="libro"></div>
  <div class="estado" id="estado">
    <div class="spinner" aria-hidden="true"></div>
    <p id="estadoTexto">Preparando la edición…</p>
  </div>
</div>

<nav class="controles" aria-label="Controles del visor">
  <button class="btn" id="btnPrev" type="button">‹ Anterior</button>
  <span class="indicador" id="indicador">— / —</span>
  <button class="btn" id="btnNext" type="button">Siguiente ›</button>
  <span class="sep" aria-hidden="true"></span>
  <button class="btn" id="btnZoomOut" type="button">− Alejar</button>
  <button class="btn" id="btnZoomIn" type="button">+ Acercar</button>
  <span class="sep" aria-hidden="true"></span>
  <button class="btn btn-beige" id="btnAbrir" type="button">Abrir PDF</button>
  <button class="btn btn-beige" id="btnFull" type="button">Pantalla completa</button>
  <a class="btn btn-primario" id="btnDescargar" href="voz-estudiantil-2026-08.pdf" download>Descargar</a>
  <input type="file" id="archivo" accept="application/pdf">
</nav>

<!-- Única dependencia externa: PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  'use strict';

  // ===== CONFIGURACIÓN =====
  var PDF_URL = 'voz-estudiantil-2026-08.pdf';  // cambia esto para publicar otra edición
  var ESCALA  = 2.0;    // nitidez del render
  var CALIDAD = 0.85;   // compresión JPEG

  var escenario  = document.getElementById('escenario');
  var libro      = document.getElementById('libro');
  var estado     = document.getElementById('estado');
  var estadoTxt  = document.getElementById('estadoTexto');
  var indicador  = document.getElementById('indicador');
  var btnPrev    = document.getElementById('btnPrev');
  var btnNext    = document.getElementById('btnNext');
  var btnZoomIn  = document.getElementById('btnZoomIn');
  var btnZoomOut = document.getElementById('btnZoomOut');
  var btnFull    = document.getElementById('btnFull');
  var btnAbrir   = document.getElementById('btnAbrir');
  var archivo    = document.getElementById('archivo');

  var paginas = [];      // dataURL por página
  var total   = 0;
  var indice  = 0;       // índice de la hoja izquierda del pliego actual
  var prop    = 1.294;   // alto/ancho
  var zoom    = 1;
  var girando = false;

  function doble() { return window.innerWidth >= 860 && total > 1; }

  function aviso(titulo, detalle) {
    estado.hidden = false;
    estado.innerHTML = '<p><strong>' + titulo + '</strong>' + (detalle || '') + '</p>' +
      '<button class="btn btn-beige" id="reintentar" type="button">Abrir PDF desde mi equipo</button>';
    var r = document.getElementById('reintentar');
    if (r) r.addEventListener('click', function () { archivo.click(); });
  }

  // ===== CARGA =====
  if (!window.pdfjsLib) {
    aviso('No se pudo cargar PDF.js.', 'Revisa tu conexion a internet y recarga la pagina.');
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  function abrir(origen) {
    estado.hidden = false;
    estado.innerHTML = '<div class="spinner" aria-hidden="true"></div><p id="estadoTexto">Preparando la edicion...</p>';
    estadoTxt = document.getElementById('estadoTexto');
    paginas = []; indice = 0; girando = false;

    pdfjsLib.getDocument(origen).promise.then(function (pdf) {
      total = pdf.numPages;
      var cadena = Promise.resolve();
      var acc = [];
      for (var i = 1; i <= total; i++) {
        (function (n) {
          cadena = cadena.then(function () {
            return render(pdf, n).then(function (img) { acc.push(img); });
          });
        })(i);
      }
      return cadena.then(function () { return acc; });
    }).then(function (imgs) {
      paginas = imgs;
      estado.hidden = true;
      dibujar();
    }).catch(function (err) {
      console.error(err);
      aviso('No se pudo abrir el PDF.',
        'Coloca <code>' + PDF_URL + '</code> junto a este archivo y abrelo desde un servidor web ' +
        '(por ejemplo <code>python3 -m http.server</code>). O selecciona el PDF manualmente:');
    });
  }

  function render(pdf, n) {
    return pdf.getPage(n).then(function (pagina) {
      var vp = pagina.getViewport({ scale: ESCALA });
      if (n === 1) prop = vp.height / vp.width;
      var c = document.createElement('canvas');
      c.width = vp.width; c.height = vp.height;
      if (estadoTxt) estadoTxt.textContent = 'Preparando pagina ' + n + ' de ' + pdf.numPages + '...';
      return pagina.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise
        .then(function () { return c.toDataURL('image/jpeg', CALIDAD); });
    });
  }

  // ===== MEDIDAS =====
  function medidas() {
    var cols = doble() ? 2 : 1;
    var dispAlto  = escenario.clientHeight - 34;
    var dispAncho = escenario.clientWidth - 30;
    var alto = dispAlto, ancho = alto / prop;
    if (ancho * cols > dispAncho) { ancho = dispAncho / cols; alto = ancho * prop; }
    return { ancho: Math.round(ancho), alto: Math.round(alto) };
  }

  // ===== DIBUJO =====
  function dibujar() {
    var m = medidas();
    libro.innerHTML = '';
    libro.style.transform = 'scale(' + zoom + ')';

    var cols = doble() ? 2 : 1;
    for (var k = 0; k < cols; k++) {
      var n = indice + k;
      var hoja = document.createElement('div');
      hoja.className = 'hoja' + (paginas[n] ? '' : ' hoja--vacia');
      hoja.style.width = m.ancho + 'px';
      hoja.style.height = m.alto + 'px';
      if (paginas[n]) {
        var img = document.createElement('img');
        img.src = paginas[n];
        img.alt = 'Pagina ' + (n + 1) + ' de ' + total;
        hoja.appendChild(img);
      }
      libro.appendChild(hoja);
    }
    actualizar();
  }

  function actualizar() {
    var cols = doble() ? 2 : 1;
    var desde = indice + 1;
    var hasta = Math.min(indice + cols, total);
    indicador.textContent = total
      ? (desde === hasta ? desde + ' / ' + total : desde + '-' + hasta + ' / ' + total)
      : '- / -';
    btnPrev.disabled = girando || indice <= 0;
    btnNext.disabled = girando || indice + cols >= total;
    btnZoomIn.disabled = zoom >= 3;
    btnZoomOut.disabled = zoom <= 0.6;
  }

  // ===== PASAR PAGINA (CSS 3D propio) =====
  function pasar(dir) {
    var cols = doble() ? 2 : 1;
    if (girando) return;
    if (dir > 0 && indice + cols >= total) return;
    if (dir < 0 && indice <= 0) return;

    var m = medidas();
    var siguiente = indice + dir * cols;
    var frenteIdx = dir > 0 ? indice + cols - 1 : indice;
    var traseIdx  = dir > 0 ? siguiente : siguiente + cols - 1;

    if (!paginas[frenteIdx]) { indice = siguiente; dibujar(); return; }

    girando = true; actualizar();

    var leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.style.width = m.ancho + 'px';
    leaf.style.height = m.alto + 'px';
    leaf.style.left = (dir > 0 && cols === 2 ? m.ancho : 0) + 'px';
    leaf.style.transformOrigin = dir > 0 ? 'left center' : 'right center';

    leaf.innerHTML =
      '<div class="cara cara--frente"><img src="' + paginas[frenteIdx] + '" alt=""></div>' +
      '<div class="cara cara--tras">' + (paginas[traseIdx] ? '<img src="' + paginas[traseIdx] + '" alt="">' : '') + '</div>';

    libro.appendChild(leaf);
    void leaf.offsetWidth; // fuerza reflow para que la transicion se aplique
    leaf.style.transform = 'rotateY(' + (dir > 0 ? -180 : 180) + 'deg)';

    setTimeout(function () {
      indice = siguiente;
      girando = false;
      dibujar();
    }, 640);
  }

  btnPrev.addEventListener('click', function () { pasar(-1); });
  btnNext.addEventListener('click', function () { pasar(1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') pasar(-1);
    if (e.key === 'ArrowRight') pasar(1);
  });

  // Deslizar en movil
  var x0 = null;
  escenario.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  escenario.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 55) pasar(dx < 0 ? 1 : -1);
    x0 = null;
  }, { passive: true });

  // ===== ZOOM =====
  btnZoomIn.addEventListener('click', function () {
    zoom = Math.min(3, Math.round((zoom + 0.25) * 100) / 100);
    libro.style.transform = 'scale(' + zoom + ')'; actualizar();
  });
  btnZoomOut.addEventListener('click', function () {
    zoom = Math.max(0.6, Math.round((zoom - 0.25) * 100) / 100);
    libro.style.transform = 'scale(' + zoom + ')'; actualizar();
  });

  // ===== PANTALLA COMPLETA =====
  btnFull.addEventListener('click', function () {
    if (!document.fullscreenElement) {
      if (escenario.requestFullscreen) escenario.requestFullscreen().catch(function(){});
    } else { document.exitFullscreen(); }
  });
  document.addEventListener('fullscreenchange', function () {
    btnFull.textContent = document.fullscreenElement ? 'Salir' : 'Pantalla completa';
    setTimeout(dibujar, 130);
  });

  // ===== ABRIR ARCHIVO LOCAL =====
  btnAbrir.addEventListener('click', function () { archivo.click(); });
  archivo.addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var lector = new FileReader();
    lector.onload = function () { abrir({ data: new Uint8Array(lector.result) }); };
    lector.readAsArrayBuffer(f);
  });

  // ===== RESPONSIVE =====
  var t;
  window.addEventListener('resize', function () {
    clearTimeout(t);
    t = setTimeout(function () { if (paginas.length) dibujar(); }, 180);
  });

  // Arranque
  abrir(PDF_URL);

})();
</script>

</body>
</html>
