<body>
<x-dc>

  <script src="_ds/organic-f203ec68-e461-4e72-a388-64270db32e26/_ds_bundle.js"></script>
  <style>
    :root{
      --color-accent:#2f5c8a; --color-accent-100:#e9eef5; --color-accent-200:#c9d7e8;
      --color-accent-300:#a0bad7; --color-accent-400:#6f95c0; --color-accent-500:#3f6da3;
      --color-accent-600:#2f5c8a; --color-accent-700:#234069; --color-accent-800:#182c4a; --color-accent-900:#0e1a2d;
      --color-accent-2:#b98f47; --color-accent-2-100:#faf3e6; --color-accent-2-200:#f0e0bf;
      --color-accent-2-300:#e2c896; --color-accent-2-400:#d1ac6c; --color-accent-2-500:#b98f47;
      --color-accent-2-600:#96712f; --color-accent-2-700:#745523; --color-accent-2-800:#523c19; --color-accent-2-900:#31240f;
    }
    body{margin:0}
    a{color:var(--color-accent-700)}
    a:hover{color:var(--color-accent-900)}
    .wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(20px,5vw,64px)}
    h1,h2,h3{font-family:var(--font-body);font-weight:700;letter-spacing:-0.01em}
    .contact-item{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--color-text)}
    .contact-item:hover{color:var(--color-accent-700)}
    @media (max-width:820px){ .contact-grid{grid-template-columns:1fr !important} }
  </style>
</helmet>
<dc-import name="Nav" active="contacto" hint-size="100%,74px"></dc-import>

<section class="wrap" style="padding-block:52px 16px">
  <span style="display:block;font-family:var(--font-body);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700);font-weight:600;margin-bottom:14px">Contacto</span>

  <p style="font-size:16px;opacity:.8;max-width:56ch;margin:0">Escríbenos o visítanos. Estamos para responder tus preguntas sobre nuestro colegio.</p>
</section>

    <a class="contact-item" href="tel:+56940174461">

      <span>+56 9 4017 4461</span>
    </a>
    <a class="contact-item" href="mailto:sanagustin192@yahoo.es">
      <span style="width:40px;height:40px;border-radius:50%;background:var(--color-accent-100);display:flex;align-items:center;justify-content:center;color:var(--color-accent-700);flex-shrink:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
